<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATC Radar - Metaverse International Airport</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Courier New', monospace;
        color: #00ff00;
        overflow: auto;
      }
      #game-container {
        display: flex;
        gap: 20px;
        padding: 20px;
        width: 100%;
        max-width: 1240px;
      }
      #radar-canvas {
        border: 2px solid #00ff00;
        flex: 1;
        min-width: 0;
        height: auto;
      }
      #side-panel {
        width: 280px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #status-bar {
        background: #111;
        padding: 10px;
        border: 1px solid #00ff00;
      }
      #flight-strips {
        background: #111;
        padding: 10px;
        border: 1px solid #00ff00;
        flex: 1;
        overflow-y: auto;
        max-height: 300px;
      }
      #command-panel {
        background: #111;
        padding: 10px;
        border: 1px solid #00ff00;
        display: none;
      }
      #command-panel.active {
        display: block;
      }
      .flight-strip {
        background: #1a1a1a;
        padding: 8px;
        margin-bottom: 5px;
        border-left: 3px solid #00ff00;
        cursor: pointer;
        font-size: 12px;
      }
      .flight-strip:hover {
        background: #222;
      }
      .flight-strip.selected {
        border-left-color: #ffff00;
        background: #222;
      }
      .flight-strip.arrival {
        border-left-color: #00ffff;
      }
      .flight-strip.arrival.selected {
        border-left-color: #ffff00;
      }
      .flight-strip.departure {
        border-left-color: #ff9900;
      }
      .flight-strip.departure.selected {
        border-left-color: #ffff00;
      }
      .flight-strip.holding {
        border-left-color: #ffff00;
      }
      .btn {
        background: #1a1a1a;
        color: #00ff00;
        border: 1px solid #00ff00;
        padding: 5px 10px;
        cursor: pointer;
        font-family: inherit;
        margin: 2px;
      }
      .btn:hover {
        background: #00ff00;
        color: #0a0a0a;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      input[type="number"], select {
        background: #1a1a1a;
        color: #00ff00;
        border: 1px solid #00ff00;
        padding: 5px;
        width: 80px;
        font-family: inherit;
      }
      select {
        width: 100px;
      }
      h3 {
        margin-bottom: 10px;
        font-size: 14px;
      }
      .aircraft-type {
        display: inline-block;
        padding: 2px 6px;
        font-size: 10px;
        border-radius: 3px;
        margin-left: 5px;
      }
      .aircraft-type.arr {
        background: #00ffff;
        color: #000;
      }
      .aircraft-type.dep {
        background: #ff9900;
        color: #000;
      }
      .command-row {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .command-row label {
        min-width: 70px;
      }
      .command-section {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid #333;
      }
      .command-section h4 {
        font-size: 12px;
        color: #888;
        margin-bottom: 8px;
      }
      .legend {
        font-size: 11px;
        margin-top: 5px;
        padding-top: 5px;
        border-top: 1px solid #333;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 3px 0;
      }
      .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 2px;
      }
      @media (max-width: 960px) {
        body {
          align-items: flex-start;
        }
        #game-container {
          gap: 10px;
          padding: 10px;
        }
        #side-panel {
          width: 180px;
        }
        #flight-strips {
          max-height: 200px;
        }
        .flight-strip {
          font-size: 10px;
          padding: 5px;
        }
        .btn {
          padding: 3px 6px;
          font-size: 11px;
        }
        input[type="number"], select {
          width: 55px;
          padding: 3px;
          font-size: 11px;
        }
        select {
          width: 70px;
        }
        .command-row label {
          min-width: 50px;
          font-size: 11px;
        }
        h3 {
          font-size: 11px;
        }
      }
      @media (max-width: 500px) {
        #game-container {
          gap: 6px;
          padding: 6px;
        }
        #side-panel {
          width: 120px;
        }
        .flight-strip {
          font-size: 8px;
          padding: 4px;
          margin-bottom: 3px;
        }
        .btn {
          padding: 2px 4px;
          font-size: 9px;
        }
        input[type="number"], select {
          width: 45px;
          padding: 2px;
          font-size: 9px;
        }
        select {
          width: 55px;
        }
        .command-row label {
          min-width: 40px;
          font-size: 9px;
        }
        .command-row {
          gap: 3px;
        }
        h3 {
          font-size: 9px;
        }
        #status-bar {
          font-size: 9px;
          padding: 6px;
        }
        .legend {
          font-size: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="radar-canvas" width="900" height="700"></canvas>
      <div id="side-panel">
        <div id="status-bar">
          <div>Score: <span id="score">0</span></div>
          <div>Aircraft: <span id="aircraft-count">0</span></div>
          <div>Landed: <span id="landed-count">0</span></div>
          <div class="legend">
            <div class="legend-item">
              <div class="legend-color" style="background: #00ffff;"></div>
              <span>Arrivals</span>
            </div>
            <div class="legend-item">
              <div class="legend-color" style="background: #ff9900;"></div>
              <span>Departures</span>
            </div>
            <div class="legend-item">
              <div class="legend-color" style="background: #ffff00;"></div>
              <span>Holding</span>
            </div>
          </div>
        </div>
        <div id="flight-strips">
          <h3>FLIGHT STRIPS</h3>
          <div id="strips-container"></div>
        </div>
        <div id="command-panel">
          <h3>COMMANDS - <span id="selected-callsign"></span> <span id="selected-type" class="aircraft-type"></span></h3>

          <!-- Vector commands (flying aircraft only) -->
          <div id="vector-commands">
            <div class="command-row">
              <label>Heading:</label>
              <input type="number" id="cmd-heading" min="0" max="359" step="5">
              <button class="btn" id="btn-heading">SET</button>
            </div>
            <div class="command-row">
              <label>Altitude:</label>
              <input type="number" id="cmd-altitude" min="10" max="150" step="5">
              <button class="btn" id="btn-altitude">SET</button>
            </div>
            <div class="command-row">
              <label>Speed:</label>
              <input type="number" id="cmd-speed" min="120" max="280" step="10">
              <button class="btn" id="btn-speed">SET</button>
            </div>
          </div>

          <!-- Arrival commands -->
          <div id="arrival-commands" class="command-section">
            <h4>ARRIVAL CLEARANCE</h4>
            <div class="command-row">
              <label>ILS Rwy:</label>
              <select id="cmd-approach-runway">
                <option value="">Select...</option>
              </select>
              <button class="btn" id="btn-approach">CLEAR</button>
            </div>
          </div>

          <!-- Departure commands -->
          <div id="departure-commands" class="command-section">
            <h4>DEPARTURE CLEARANCE</h4>
            <div class="command-row">
              <label>Takeoff:</label>
              <select id="cmd-takeoff-runway">
                <option value="">Select...</option>
              </select>
              <button class="btn" id="btn-takeoff">CLEAR</button>
            </div>
          </div>

          <!-- Waypoint command -->
          <div id="waypoint-commands" class="command-section">
            <h4>NAVIGATION</h4>
            <div class="command-row">
              <label>Direct To:</label>
              <select id="cmd-waypoint">
                <option value="">Select...</option>
              </select>
              <button class="btn" id="btn-waypoint">SET</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
