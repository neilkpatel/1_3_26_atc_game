<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATC Radar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Courier New', monospace;
        color: #00ff00;
      }
      #game-container {
        display: flex;
        gap: 20px;
        padding: 20px;
      }
      #radar-canvas {
        border: 2px solid #00ff00;
      }
      #side-panel {
        width: 280px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #status-bar {
        background: #111;
        padding: 10px;
        border: 1px solid #00ff00;
      }
      #flight-strips {
        background: #111;
        padding: 10px;
        border: 1px solid #00ff00;
        flex: 1;
        overflow-y: auto;
        max-height: 350px;
      }
      #command-panel {
        background: #111;
        padding: 10px;
        border: 1px solid #00ff00;
        display: none;
      }
      #command-panel.active {
        display: block;
      }
      .flight-strip {
        background: #1a1a1a;
        padding: 8px;
        margin-bottom: 5px;
        border-left: 3px solid #00ff00;
        cursor: pointer;
        font-size: 12px;
      }
      .flight-strip:hover {
        background: #222;
      }
      .flight-strip.selected {
        border-left-color: #ffff00;
        background: #222;
      }
      .flight-strip.arrival {
        border-left-color: #00ffff;
      }
      .flight-strip.arrival.selected {
        border-left-color: #ffff00;
      }
      .flight-strip.departure {
        border-left-color: #ff9900;
      }
      .flight-strip.departure.selected {
        border-left-color: #ffff00;
      }
      .btn {
        background: #1a1a1a;
        color: #00ff00;
        border: 1px solid #00ff00;
        padding: 5px 10px;
        cursor: pointer;
        font-family: inherit;
        margin: 2px;
      }
      .btn:hover {
        background: #00ff00;
        color: #0a0a0a;
      }
      input[type="number"] {
        background: #1a1a1a;
        color: #00ff00;
        border: 1px solid #00ff00;
        padding: 5px;
        width: 60px;
        font-family: inherit;
      }
      h3 {
        margin-bottom: 10px;
        font-size: 14px;
      }
      .aircraft-type {
        display: inline-block;
        padding: 2px 6px;
        font-size: 10px;
        border-radius: 3px;
        margin-left: 5px;
      }
      .aircraft-type.arr {
        background: #00ffff;
        color: #000;
      }
      .aircraft-type.dep {
        background: #ff9900;
        color: #000;
      }
      #approach-row {
        margin-top: 10px;
      }
      .command-row {
        margin-top: 8px;
      }
      .legend {
        font-size: 11px;
        margin-top: 5px;
        padding-top: 5px;
        border-top: 1px solid #333;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 3px 0;
      }
      .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="radar-canvas" width="900" height="700"></canvas>
      <div id="side-panel">
        <div id="status-bar">
          <div>Score: <span id="score">0</span></div>
          <div>Aircraft: <span id="aircraft-count">0</span></div>
          <div>Landed: <span id="landed-count">0</span></div>
          <div class="legend">
            <div class="legend-item">
              <div class="legend-color" style="background: #00ffff;"></div>
              <span>Arrivals</span>
            </div>
            <div class="legend-item">
              <div class="legend-color" style="background: #ff9900;"></div>
              <span>Departures</span>
            </div>
          </div>
        </div>
        <div id="flight-strips">
          <h3>FLIGHT STRIPS</h3>
          <div id="strips-container"></div>
        </div>
        <div id="command-panel">
          <h3>COMMANDS - <span id="selected-callsign"></span> <span id="selected-type" class="aircraft-type"></span></h3>
          <div class="command-row">
            <label>Heading:</label>
            <input type="number" id="cmd-heading" min="0" max="359" step="5">
            <button class="btn" id="btn-heading">SET</button>
          </div>
          <div class="command-row">
            <label>Altitude (x100ft):</label>
            <input type="number" id="cmd-altitude" min="10" max="150" step="5">
            <button class="btn" id="btn-altitude">SET</button>
          </div>
          <div class="command-row">
            <label>Speed (kts):</label>
            <input type="number" id="cmd-speed" min="120" max="280" step="10">
            <button class="btn" id="btn-speed">SET</button>
          </div>
          <div id="approach-row" class="command-row">
            <button class="btn" id="btn-approach">CLEAR APPROACH</button>
            <span style="font-size: 11px; color: #888;">(Arrivals only)</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
